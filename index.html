];let active=Number(sessionStorage.getItem("day")||8);let journalRequest=0;function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function loadJournal(){const i=active,id=++journalRequest,el=document.getElementById('journalEntries');if(!el)return;el.textContent='Loading shared notes…';try{const res=await fetch('https://api.github.com/repos/csdubov/japan-2026-planner/issues/'+(i+1)+'/comments?per_page=100',{headers:{'Accept':'application/vnd.github+json'},cache:'no-store'});if(!res.ok)throw Error('Unavailable');const notes=await res.json();if(id!==journalRequest||i!==active)return;el.innerHTML=notes.length?notes.map(n=>'<div class="entry"><small>'+esc(n.created_at.slice(0,10))+' · '+esc(n.user?.login||'Contributor')+'</small>'+esc(n.body||'')+'</div>').join(''):'No notes yet. Add the first memory!';}catch(e){if(id===journalRequest)el.textContent='Could not load notes. Try Refresh.'}}function render(){document.getElementById("tabs").innerHTML=days.map((d,i)=>'<button class="'+(i===active?'active':'')+'" onclick="active='+i+';sessionStorage.setItem(\'day\',active);render()">'+d.date+'</button>').join('');let d=days[active];document.getElementById("page").innerHTML='<h2>'+d.title+'</h2><p class="notice">'+d.note+'</p>'+d.items.map(x=>'<article class="item '+(x[4]?'booked':'')+'"><div class="time">'+x[0]+'</div><div class="name">'+x[1]+'</div>'+(x[4]?'<div class="tag">CONFIRMED</div>':'')+'<div class="how">'+x[2]+'</div><a class="maps" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(x[3])+'">📍 Open in Google Maps ↗</a></article>').join('')+'<section class="journal"><h3>📓 Shared Trip Journal</h3><p>Both of you can add memories. Sign in to GitHub on either phone, then add a comment. Notes appear here on both devices.</p><div id="journalEntries">Loading notes…</div><a target="_blank" rel="noopener" href="https://github.com/csdubov/japan-2026-pla
